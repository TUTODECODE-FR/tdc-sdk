# CI TDC-SDK / TDC Studio v2.0.0 — desktop only (Win / macOS / Linux)
#
# TDC Studio n'est PAS une app Android : aucun job Android ici.
# Builds OS (Win/Mac/Linux) = GitHub Actions UNIQUEMENT, après acceptation
# du merge (push main → auto_tag → tag v* → mirror GitHub → release.yml).
# Les pipelines MR = validate (analyze/test/security) + compile-check Linux optionnel.
# Les artefacts release multi-OS restent sur GitHub Actions (après tag v*).
#
# Trois types de pipeline :
#   1. MR (merge_request_event) → stage validate uniquement
#   2. main (push après merge MR) → auto_tag uniquement (~1 min Alpine)
#   3. tag v* → mirror_tag_to_github → sync_github_multi_os_builds → release_gitlab
# Voir docs/ci-github-mirror.md

image: ghcr.io/cirruslabs/flutter:stable

variables:
  GIT_DEPTH: "0"
  STUDIO_DIR: "TDC-Studio-IDE-App"
  DS_EXCLUDED_PATHS: "TDC-Studio-IDE-App/macos/**,TDC-Studio-IDE-App/windows/**,TDC-Studio-IDE-App/linux/**"
  # Mirror GitHub repo that builds multi-OS binaries (saves GitLab runner minutes).
  GITHUB_RELEASE_REPO: "TUTODECODE-FR/tdc-sdk"

default:
  interruptible: false

# Pas de pipeline sur les branches feature (économie quotas) — seulement MR, main et tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: never

stages:
  - validate
  - sync-os-builds
  - release

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/global_packages

# === STAGE: VALIDATE (parity with T2DECODE) ===
dco_check:
  stage: validate
  image:
    name: alpine/git
    entrypoint: [""]
  script:
    - echo "Checking commits for DCO (Signed-off-by) signature..."
    - MISSING_DCO=0
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    - git fetch origin "$TARGET_BRANCH" || true
    - |
      COMMITS=$(git rev-list "origin/$TARGET_BRANCH..HEAD" 2>/dev/null || git log -n 5 --format=%H)
      for commit in $COMMITS; do
        if ! git log -1 --format=%B "$commit" | grep -qi "Signed-off-by:"; then
          echo "❌ Error: Commit $commit is missing the 'Signed-off-by:' line."
          MISSING_DCO=1
        else
          echo "✅ Commit $commit is signed."
        fi
      done
    - |
      if [ $MISSING_DCO -eq 1 ]; then
        echo "Please amend your commits with 'git commit --amend -s' and force push."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Forward protection only (does not rewrite historical main commits).
no_cursor_coauthor:
  stage: validate
  image:
    name: alpine/git
    entrypoint: [""]
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    # Materialize remote-tracking ref (fresh CI clones often only update FETCH_HEAD).
    - git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" || true
    - chmod +x scripts/check_no_cursor_coauthor.sh
    # Script is POSIX /bin/sh (alpine/git has no bash).
    - sh ./scripts/check_no_cursor_coauthor.sh "origin/${TARGET_BRANCH}..HEAD"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Anti-collision « prendre #<iid> » — voir VOLUNTEER_BOARD.md / scripts/volunteer_claim_apply.py
# Variable CI recommandée : PROJECT_ACCESS_TOKEN (api) pour la vérif assignee live.
volunteer_claim_validate:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}" || true
  script:
    - python3 scripts/test_volunteer_claim.py
    - python3 scripts/volunteer_claim_apply.py --mode validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Analyze must fail on infos/warnings (no soft fallback).
flutter_analyze:
  stage: validate
  script:
    - cd "$STUDIO_DIR"
    - flutter pub get
    - flutter analyze --fatal-infos --fatal-warnings
    - |
      if grep -q "url: \"http://" pubspec.lock 2>/dev/null; then
        echo "❌ Error: Insecure HTTP dependency source found in pubspec.lock!"
        exit 1
      else
        echo "✅ Supply chain HTTPS check passed."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

flutter_test:
  stage: validate
  script:
    - cd "$STUDIO_DIR"
    - flutter pub get
    - flutter test
    - cd ..
    - python3 scripts/validate_tdc.py examples/ || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Optional MR compile check (release binaries still built on GitHub after tag).
# allow_failure: transitional until shared runners + apt deps are proven green.
build_linux_check:
  stage: validate
  allow_failure: true
  before_script:
    - |
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y --no-install-recommends \
        clang cmake ninja-build pkg-config \
        libgtk-3-dev liblzma-dev
  script:
    - cd "$STUDIO_DIR"
    - flutter pub get
    - flutter config --enable-linux-desktop
    - flutter build linux --debug
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

airgap_leak_canary:
  stage: validate
  script:
    - python3 scripts/audit_airgap_leak.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

binary_hardening_audit:
  stage: validate
  script:
    - python3 scripts/audit_binary_hardening.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

sbom_generator:
  stage: validate
  script:
    - python3 scripts/generate_sbom.py
  artifacts:
    paths:
      - sbom-cyclonedx.json
      - sbom-spdx.json
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Single security-parity suite (formerly 4 duplicate jobs running the same test file).
studio_security_parity:
  stage: validate
  script:
    - cd "$STUDIO_DIR"
    - flutter pub get
    - flutter test test/unit/studio_security_parity_test.dart
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

dependency_confusion_shield:
  stage: validate
  script:
    - python3 scripts/check_dependency_confusion.py "$STUDIO_DIR/pubspec.yaml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

secrets_and_private_keys_scan:
  stage: validate
  script:
    - |
      if grep -rE "(AKIA[0-9A-Z]{16}|GH[A-Za-z0-9_]{36,40}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|sk_live_[0-9a-zA-Z]{24}|AIza[0-9A-Za-z-_]{35}|xox[baprs]-[0-9a-zA-Z]{10,48}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" . \
        --exclude-dir=".git" --exclude-dir=".dart_tool" --exclude-dir="build" \
        --exclude-dir=".github" --exclude=".gitlab-ci.yml" \
        --binary-files=without-match; then
        echo "❌ Error: Hardcoded secrets or private keys found!"
        exit 1
      else
        echo "✅ Enhanced secrets scan passed."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

megalinter:
  stage: validate
  image: oxsecurity/megalinter:v8
  variables:
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    MEGALINTER_CONFIG: .mega-linter.yml
    # Full-tree scan (VALIDATE_ALL_CODEBASE) can be noisy on existing main — keep soft until cleaned.
    DISABLE_ERRORS: "true"
  script:
    # MegaLinter runs via image entrypoint; job stays soft while codebase debt is cleared.
    - "true"
  artifacts:
    when: always
    paths:
      - megalinter-reports
    expire_in: 1 week
  # Transitional: full-codebase MegaLinter may fail on pre-existing findings.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

gitleaks:
  stage: validate
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --source=. --no-git=false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

trivy_scan:
  stage: validate
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners config,vuln,secret --severity HIGH,CRITICAL --exit-code 1 .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

backdoor_and_anti_malware_scan:
  stage: validate
  script:
    - echo "🔍 Scanning codebase for backdoor patterns..."
    - |
      FOUND_MALWARE=0
      if grep -rE "(/dev/tcp/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+|nc\s+-e\s+/bin|ncat\s+-e\s+/bin|python.*socket.*connect\(|perl.*Socket.*connect\(|ruby.*TCPSocket\.new\()" . \
        --exclude-dir=".git" --exclude-dir="build" --exclude-dir="assets" --exclude=".gitlab-ci.yml" --binary-files=without-match; then
        echo "❌ Error: Potential reverse shell pattern detected!"
        FOUND_MALWARE=1
      fi
      if grep -rE "(eval\s*\(\s*base64_decode|base64\s+(-d|--decode)\s*\|\s*\b(sh|bash|zsh)\b|curl\s+.*\|\s*\b(sh|bash)\b|wget\s+.*\|\s*\b(sh|bash)\b)" . \
        --exclude-dir=".git" --exclude-dir="build" --exclude-dir="assets" --exclude=".gitlab-ci.yml" --binary-files=without-match; then
        echo "❌ Error: Obfuscated remote execution pattern detected!"
        FOUND_MALWARE=1
      fi
      if [ $FOUND_MALWARE -eq 1 ]; then exit 1; else echo "✅ Anti-malware scan passed."; fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

semgrep_sast:
  stage: validate
  image: returntocorp/semgrep:latest
  script:
    - semgrep scan --config auto --exclude="build" --exclude="assets" --error
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# ClamAV stays soft: signature FPs / mirror freshness can fail clean trees.
clamav_antivirus:
  stage: validate
  image: clamav/clamav:latest
  script:
    - freshclam || true
    - clamscan -r --exclude-dir="build" --exclude-dir=".git" --exclude-dir=".dart_tool" .
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

zero_trust_tamper_defense:
  stage: validate
  script:
    - echo "🛡️ Zero-Trust Bidi Attack Audit..."
    - |
      if grep -rnU $'\u202A\|\u202B\|\u202D\|\u202E\|\u2066\|\u2067\|\u2068\|\u202C\|\u2069' "$STUDIO_DIR/lib/" scripts/; then
        echo "❌ CRITICAL: Invisible Trojan Source / Bidi character attack detected!"
        exit 1
      else
        echo "✅ Zero-Trust Bidi Attack Audit PASSED."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

military_hardening_audit:
  stage: validate
  script:
    - echo "🛡️ Military-Grade Hardening Audit..."
    - |
      UNSAFE_EXEC=0
      if grep -rE "Process\.run\(['\"](sh|bash|zsh|cmd|powershell)" "$STUDIO_DIR/lib/" --binary-files=without-match; then
        echo "⚠️ Warning: Raw shell process execution detected — verify sanitization."
      fi
      if grep -rE "\b(strcpy|strcat|sprintf|gets)\b" "$STUDIO_DIR/linux/" "$STUDIO_DIR/windows/" "$STUDIO_DIR/macos/" 2>/dev/null; then
        echo "❌ CRITICAL: Unsafe C/C++ memory functions detected!"
        UNSAFE_EXEC=1
      fi
      if [ $UNSAFE_EXEC -eq 1 ]; then exit 1; else echo "✅ Military-Grade Hardening Audit PASSED."; fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# === Artefacts release multi-OS = GitHub Actions uniquement ===
# MR peut lancer build_linux_check (compile-check soft). Les binaires Win/macOS/Linux
# de release restent produits par .github/workflows/release.yml après tag v*.
# Aucun job Android (Studio n'en a pas).

# === STAGE: VOLUNTEER CLAIM APPLY (main after merge of prendre #N) ===
# Assigne l'issue GitLab + label en-cours. Idempotent. Skip si pas de claim.
# Requires PROJECT_ACCESS_TOKEN (api) — CI_JOB_TOKEN may lack issue write scope.
volunteer_claim_apply:
  stage: sync-os-builds
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin main || true
  script:
    - python3 scripts/volunteer_claim_apply.py --mode apply
  rules:
    # Script no-ops quickly when no claim is detected (title / files).
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

# === STAGE: AUTO-TAG (main → vX.Y.Z.N) ===
# Requires CI variable PROJECT_ACCESS_TOKEN (scopes: api, write_repository).
# Without it, the job skips green — create tags manually or add the token.
auto_tag:
  stage: sync-os-builds
  image: alpine:latest
  script:
    - apk add --no-cache git curl
    - |
      if [ -z "${PROJECT_ACCESS_TOKEN:-}" ]; then
        echo "⏭️ PROJECT_ACCESS_TOKEN unset — skip auto_tag (keeps main green)."
        echo "Add a Project Access Token (api + write_repository) as masked CI variable,"
        echo "or tag manually: git tag -a vX.Y.Z.N && git push origin vX.Y.Z.N"
        exit 0
      fi
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --tags origin || true
    - VERSION_LINE=$(grep '^version:' "$STUDIO_DIR/pubspec.yaml")
    - BASE_VERSION=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*//;s/\+.*//;s/[[:space:]]*$//')
    - echo "Base version $BASE_VERSION"
    - |
      MATCHING_TAGS=$(git tag -l "v${BASE_VERSION}.*" | grep -E "^v${BASE_VERSION}\.[0-9]+$" || true)
      if [ -z "$MATCHING_TAGS" ]; then
        NEXT_TAG="v${BASE_VERSION}.1"
      else
        LATEST_SUFFIX=$(echo "$MATCHING_TAGS" | sed "s/^v${BASE_VERSION}\.//" | sort -n | tail -n1)
        NEXT_SUFFIX=$((LATEST_SUFFIX + 1))
        NEXT_TAG="v${BASE_VERSION}.${NEXT_SUFFIX}"
      fi
      echo "Next tag $NEXT_TAG"
      echo "NEXT_TAG=$NEXT_TAG" >> auto_tag.env
    - |
      AUTH_HEADER="PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}"
      ENC_TAG=$(echo -n "$NEXT_TAG" | sed 's/\./%2E/g')
      CODE=$(curl -sS -o /tmp/tag_get.json -w "%{http_code}" \
        --header "$AUTH_HEADER" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/${ENC_TAG}")
      if [ "$CODE" = "200" ]; then
        echo "✅ Tag $NEXT_TAG already exists"
        exit 0
      fi
      HTTP=$(curl -sS -o /tmp/tag_create.json -w "%{http_code}" \
        --request POST \
        --header "$AUTH_HEADER" \
        --form "tag_name=${NEXT_TAG}" \
        --form "ref=${CI_COMMIT_SHA}" \
        --form "message=Automated release tag ${NEXT_TAG}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags")
      echo "Create tag HTTP $HTTP"
      cat /tmp/tag_create.json || true
      if [ "$HTTP" != "201" ]; then
        echo "❌ Failed to create tag $NEXT_TAG (HTTP $HTTP)"
        exit 1
      fi
      echo "✅ Created $NEXT_TAG on $CI_COMMIT_SHA"
  artifacts:
    reports:
      dotenv: auto_tag.env
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

# === STAGE: SYNC — GitLab tag → GitHub mirror → Actions builds → pull assets ===
# Architecture: GitLab = source of truth (MR, validate, tags) ; GitHub = multi-OS builds only.
# CI variables: GITHUB_TOKEN (repo scope, mirror + Actions status), PROJECT_ACCESS_TOKEN (auto_tag).
# See docs/ci-github-mirror.md for setup and troubleshooting.

# Push tag to GitHub when GitLab push mirror is not configured.
mirror_tag_to_github:
  stage: sync-os-builds
  image: alpine/git:latest
  script:
    - apk add --no-cache curl
    - |
      TAG="${CI_COMMIT_TAG}"
      REPO="${GITHUB_RELEASE_REPO:-TUTODECODE-FR/tdc-sdk}"
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "⏭️ GITHUB_TOKEN absent — on suppose que le push mirror GitLab→GitHub propage les tags."
        echo "Si sync_github_multi_os_builds échoue avec TAG_NOT_MIRRORED, ajouter GITHUB_TOKEN (scope repo)."
        exit 0
      fi
      CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${REPO}/git/ref/tags/${TAG}")
      if [ "$CODE" = "200" ]; then
        echo "✅ Tag ${TAG} déjà présent sur github.com/${REPO}"
        exit 0
      fi
      echo "📤 Push du tag ${TAG} vers GitHub (${REPO})..."
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git fetch --tags origin
      git remote remove github-push 2>/dev/null || true
      git remote add github-push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
      git push github-push "refs/tags/${TAG}:refs/tags/${TAG}"
      echo "✅ Tag ${TAG} poussé — déclenchement GitHub Actions (.github/workflows/release.yml)"
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

sync_github_multi_os_builds:
  stage: sync-os-builds
  image: alpine:latest
  needs:
    - job: mirror_tag_to_github
      optional: true
  script:
    - apk add --no-cache curl bash
    - chmod +x scripts/sync_github_release.sh
    - ./scripts/sync_github_release.sh
  artifacts:
    paths:
      - github_assets/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

release_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: sync_github_multi_os_builds
      artifacts: true
  script:
    - |
      REPO="${GITHUB_RELEASE_REPO:-TUTODECODE-FR/tdc-sdk}"
      BASE="https://github.com/${REPO}/releases/download/${CI_COMMIT_TAG}"
      if [ ! -d github_assets ] || [ -z "$(ls -A github_assets 2>/dev/null)" ]; then
        echo "❌ release_gitlab: aucun artifact reçu de sync_github_multi_os_builds."
        echo "   Cause: le job sync a échoué ou n'a pas produit github_assets/."
        echo "   Action: consulter les logs de sync_github_multi_os_builds (codes REPO_*, TAG_*, ASSETS_*)."
        exit 1
      fi
      OS_OK=0
      for F in TDC-Studio-macOS.dmg TDC-Studio-Linux.tar.gz TDC-Studio-Windows.zip; do
        if [ -f "github_assets/$F" ]; then OS_OK=1; break; fi
      done
      if [ "$OS_OK" -eq 0 ]; then
        echo "❌ release_gitlab: github_assets/ ne contient aucun binaire OS."
        echo "   Cause: GitHub Release incomplète pour ${CI_COMMIT_TAG}."
        echo "   Action: vérifier https://github.com/${REPO}/actions et la release ${CI_COMMIT_TAG}."
        exit 1
      fi
      echo "✅ Assets GitHub prêts — création Release GitLab"
      release-cli create --name "TDC Studio $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "Release $CI_COMMIT_TAG — binaires compilés sur GitHub Actions (économie quotas GitLab). Liens : https://github.com/${REPO}/releases/tag/${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"TDC-Studio-Linux.tar.gz\",\"url\":\"$BASE/TDC-Studio-Linux.tar.gz\"}" \
        --assets-link "{\"name\":\"TDC-Studio-Windows.zip\",\"url\":\"$BASE/TDC-Studio-Windows.zip\"}" \
        --assets-link "{\"name\":\"TDC-Studio-macOS.dmg\",\"url\":\"$BASE/TDC-Studio-macOS.dmg\"}" \
        --assets-link "{\"name\":\"TDC-Studio-macOS.zip\",\"url\":\"$BASE/TDC-Studio-macOS.zip\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.txt\",\"url\":\"$BASE/SHA256SUMS.txt\"}"
  rules:
    - if: $CI_COMMIT_TAG

publish_sourceforge:
  stage: release
  allow_failure: true
  image: alpine:3.16
  needs:
    - job: sync_github_multi_os_builds
      artifacts: true
      optional: true
  script:
    - apk add --no-cache openssh-client rsync curl
    - |
      if [ -z "${SF_PRIVATE_KEY:-}" ] || [ -z "${SF_USER:-}" ]; then
        echo "SourceForge credentials not set — skip."
        exit 0
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SF_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/sf_key
    - chmod 600 ~/.ssh/sf_key
    - ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
    - mkdir -p sf_assets
    - cp -f github_assets/* sf_assets/ 2>/dev/null || true
    - |
      if [ -z "$(ls -A sf_assets 2>/dev/null)" ]; then
        REPO="${GITHUB_RELEASE_REPO:-TUTODECODE-FR/tdc-sdk}"
        BASE="https://github.com/${REPO}/releases/download/${CI_COMMIT_TAG}"
        for F in TDC-Studio-Linux.tar.gz TDC-Studio-Windows.zip TDC-Studio-macOS.dmg TDC-Studio-macOS.zip SHA256SUMS.txt; do
          curl -fsSL "$BASE/$F" -o "sf_assets/$F" || true
        done
      fi
    - |
      DEST="${CI_COMMIT_TAG}"
      PROJECT="${SF_PROJECT:-tdc-studio}"
      rsync -e "ssh -i ~/.ssh/sf_key -o StrictHostKeyChecking=yes" -avP sf_assets/ \
        "$SF_USER@frs.sourceforge.net:/home/frs/project/${PROJECT}/${DEST}/" || true
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
